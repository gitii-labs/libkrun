name: Nested restore

on:
  pull_request:
  push:
    branches: [krun]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nested-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86:
    name: Running nested VM (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      NESTED_BUILD_JOBS: "2"
      NESTED_TEST_DIR: ${{ github.workspace }}/nested-test-output
      NESTED_FIRMWARE_DIR: ${{ github.workspace }}/test-firmware
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      - name: Install nested build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential musl-tools flex bison libelf-dev libssl-dev bc python3 python3-pyelftools
          rustup target add x86_64-unknown-linux-musl
      - name: Enable KVM access on the hosted VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -a -G kvm "$USER"
      - uses: actions/checkout@v4
        with:
          repository: superradcompany/libkrunfw
          ref: 56bf194627a07996dc4ce21211fe86ada4c76080
          path: test-firmware
          persist-credentials: false
      - name: Check nested virtualization host
        run: |
          uname -a
          lscpu
          test -c /dev/kvm
          ls -l /dev/kvm
          grep -Eq '(vmx|svm)' /proc/cpuinfo
          nested_module_found=false
          for module in kvm_intel kvm_amd; do
            if test -f /sys/module/$module/parameters/nested; then
              nested_module_found=true
              echo "$module nested=$(cat /sys/module/$module/parameters/nested)"
              grep -Eq '^(Y|1)$' /sys/module/$module/parameters/nested
            fi
          done
          if test "$nested_module_found" != true; then
            echo "::error::No KVM module exposes its nested virtualization setting."
            exit 1
          fi
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            echo "::error::The hosted runner account needs read/write access to /dev/kvm."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nested-cargo-${{ runner.os }}-${{ hashFiles('tests/nested-restore/**/Cargo.lock', 'tests/nested-restore/Cargo.lock') }}
      - name: Build Rust guest, host harness and firmware
        run: tests/nested-restore/ci.sh build
      - name: Capture, restore, fork and recapture with both IRQ profiles
        run: tests/nested-restore/ci.sh run
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-restore-linux-x86_64
          path: |
            ${{ github.workspace }}/nested-test-output/**/*.log
            ${{ github.workspace }}/nested-test-output/**/progress
            test-firmware/linux-*/.config
          if-no-files-found: warn
